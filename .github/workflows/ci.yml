name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Higiene agnóstica de stack, dentro do devbox (Linux).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para o gitleaks

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: pre-commit (formatação genérica, yaml/json, chaves privadas, gitleaks)
        run: devbox run -- pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: secret scan (histórico)
        run: devbox run -- just scan-secrets

  # App só para Windows: lint/test/build precisam do target MSVC, e o devbox não roda no Windows.
  # A toolchain vem do rust-toolchain.toml (o rustup do runner lê o arquivo).
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v3

      - uses: Swatinem/rust-cache@v2

      - name: pre-commit
        run: python -m pip install pre-commit

      - name: setup
        run: just setup

      - name: check (fmt-check + lint + test)
        run: just check

      - name: build
        run: just build
